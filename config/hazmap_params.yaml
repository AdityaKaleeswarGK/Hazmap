hazmap_node:
  ros__parameters:
    w: 0.750                # lap spacing (sampling resolution)
    rc: 0.375               # coverage radius per waypoint (≈ w/2)
    rd: 3.0                 # detection/sampling lookahead radius
    delta: 1                # kept for compat (unused by C* sampler)
    sweep_direction: "x"    # "x" = vertical laps, "y" = horizontal laps
    obstacle_buffer: 0.375  # kept for compat
    frontier_min_cells: 2   # kept for compat
    visualization_rate: 2.0  # Hz
    debug_logging: true
    use_hybrid_navigation: true
    direct_nav_same_lap_only: false     
    direct_nav_max_distance: 0.70       # max edge length for direct mode
    direct_nav_linear_speed: 0.20       # m/s — faster with LiDAR safety
    direct_nav_angular_speed: 1.00      # rad/s — responsive turning
    direct_nav_xy_tolerance: 0.08       # arrival tolerance (m)
    direct_nav_yaw_tolerance: 0.30      # heading tolerance before moving (rad)
    direct_nav_timeout: 20.0            # seconds
    direct_nav_fallback_to_nav2: true    # Nav2 takes over when direct hits obstacle
    direct_nav_min_clearance: 0.18      # min obstacle clearance for direct mode

    use_sim_time: true

    # Early-termination threshold. Stop coverage once this fraction of the
    # mapped free area has been visited. Lower = stops sooner with less
    # area covered; higher = visits more nooks (slower, more revisits).
    # Set high (95+) so coverage runs until natural completion / stagnation
    # rather than an arbitrary cap — utility selection + region injector
    # will push past 70% productively.
    coverage_target_percent: 95.0

    # ── Next-Best-View mode (set coverage_mode: "nbv") ──────────────────
    # Surveillance / gas-mapping style coverage: the rover drives to the
    # viewpoint that *reveals* the most still-unseen area, crediting cells
    # by graded line-of-sight observation rather than by driving over them.
    coverage_mode: "cstar"        # "cstar" | "nbv" | "boustrophedon_known" | "spiral_stc_known"
    sensor_range: 0.0             # observation range (m); 0 → use rd
    sensor_fov_deg: 360.0         # 360 = LiDAR; narrower models a camera
    nbv_n_rays: 72                # rays per viewpoint (raycast resolution)
    nbv_q_min: 0.4                # quality (0..1) at which a cell counts "observed"
    nbv_target_percent: 90.0      # stop once this much free space is observed
    nbv_cost_weight: 1.8          # travel-cost exponent in gain/cost^alpha
                                  # (also drives cstar selector α; >1 = steeper
                                  # distance penalty, prevents far-target picks
                                  # when a nearer node has comparable gain)
    nbv_max_candidates: 40        # OPEN nodes evaluated per step (perf cap)
    nbv_min_gain: 1.0             # min quality-units a view must add to bother
    nbv_no_gain_patience: 8       # stop after this many no-gain/blocked steps

    # ── Adaptive density + information-gain (cstar mode) ─────────────────
    # Lap-grid samples are kept with probability
    #   density_keep_floor + (1 - density_keep_floor) * complexity(x, y).
    # 1.0 disables the filter (uniform sampling, legacy behavior). 0.35 means
    # open empty regions keep ~35% of samples; cluttered/frontier-rich
    # regions keep ~100%. Net: fewer total nodes, but they're concentrated
    # where decisions matter (obstacle faces, unknown boundaries).
    density_keep_floor: 0.35
    complexity_radius: 0.0        # 0 → 1.5 * w. Disk radius for local C(x,y).
    # Information-gain term: predict_coverage_gain returns
    #   uncovered_free_cells + info_gain_lambda * unknown_boundary_cells.
    # Higher = candidate scoring rewards "sit on the unknown frontier"
    # alongside "add to swath." 0 disables (pure swath count, legacy).
    info_gain_lambda: 1.5
    # Map-revision rethink: every reopen_interval cstar arrivals, CLOSED
    # nodes are re-checked. A node is flipped back to OPEN if its current
    # local frontier-cell count exceeds reopen_growth_threshold × the count
    # at the time it was closed, AND has grown by at least
    # reopen_min_new_frontier cells. Bounded by reopen_max_per_node so a
    # single node can't oscillate (guarantees termination).
    reopen_interval: 8
    reopen_growth_threshold: 1.8
    reopen_min_new_frontier: 6
    reopen_max_per_node: 2

    # ── Surface inspection (orbit obstacles, view all faces) ─────────────
    # When surface_view_lambda > 0, the goal selector adds a term that
    # rewards viewpoints which newly inspect obstacle surfaces seen (with
    # line of sight) from within the camera's usable range band
    # [surface_min_view, surface_max_view]. As each face is inspected its
    # contribution drops to zero, so the rover naturally orbits an obstacle
    # to view its remaining faces, then moves on. Set to 0 for pure 2D
    # coverage (no surface inspection). Defaults model a medium-range
    # camera that frames surfaces well at ~1–3 m. Tune the lambda relative
    # to coverage gain: too low → surfaces ignored; too high → rover fixates
    # on obstacles before covering open space.
    surface_view_lambda: 3.0
    surface_sensor_range: 3.0      # max raycast range for surface views (m)
    surface_min_view: 1.0          # below this, too close to frame (m)
    surface_max_view: 3.0          # beyond this, too far to inspect (m)
    surface_n_rays: 48             # rays per surface raycast (perf vs detail)
    surface_q_min: 0.4             # quality at which a face counts "inspected"

