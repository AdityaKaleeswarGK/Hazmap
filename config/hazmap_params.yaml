hazmap_node:
  ros__parameters:
    w: 1.000                # lap spacing — ↑ from 0.75. Fewer laps in open
                            # areas (your "less laps could have been taken"
                            # observation). Sampler's obstacle-adjacency filter
                            # still places nodes in tight regions, so this
                            # mostly trims redundant open-space laps.
    rc: 0.500               # coverage radius per waypoint — ↑ from 0.375 to
                            # match w/2 (=0.5 with w=1.0). Previously rc<w/2
                            # left a 0.25 m uncovered gap between adjacent
                            # laps; nodes in those gaps still reported gain
                            # so the selector kept targeting them as
                            # "uncovered" even though practically observed.
                            # Wider swath = single-pass-covers-a-lap-stripe.
    rd: 3.0                 # detection/sampling lookahead radius
    delta: 1                # kept for compat (unused by C* sampler)
    sweep_direction: "x"    # "x" = vertical laps, "y" = horizontal laps
    obstacle_buffer: 0.375  # kept for compat
    frontier_min_cells: 2   # kept for compat
    visualization_rate: 2.0  # Hz
    debug_logging: true
    use_hybrid_navigation: true
    direct_nav_same_lap_only: false     
    direct_nav_max_distance: 0.70       # max edge length for direct mode
    direct_nav_linear_speed: 0.30       # Phase 5: dialed back to match
                                        # Nav2's stall-fix velocity (0.35)
                                        # so short hops don't outrun the
                                        # controller's safety margins.
    direct_nav_angular_speed: 1.80      # snappier turning unchanged
    direct_nav_xy_tolerance: 0.08       # arrival tolerance (m)
    direct_nav_yaw_tolerance: 0.30      # heading tolerance before moving (rad)
    direct_nav_timeout: 20.0            # seconds
    direct_nav_fallback_to_nav2: true    # Nav2 takes over when direct hits obstacle
    direct_nav_min_clearance: 0.18      # min obstacle clearance for direct mode

    use_sim_time: true

    # ── Coverage-saturation pruning ──────────────────────────────────────
    # Shifts the stopping logic from "visit every node" to "stop when no
    # node still adds coverage or leads into the unknown." Periodically
    # CLOSES OPEN nodes that sit in already-covered, fully-known space, so
    # the rover stops crossing the covered map to tick off redundant nodes
    # (the main cause of late-game trajectory overlap). Frontier nodes
    # (adjacent to unknown) are kept when prune_keep_frontier is true.
    #   prune_gain_min_cells: a node is "redundant" if fewer than this many
    #     uncovered free cells lie within its coverage radius. Higher =
    #     prune more aggressively = less overlap but slightly less coverage.
    #     Units are grid cells (≈ resolution² m² each, e.g. 15 ≈ 0.04 m²).
    prune_enable: true
    prune_interval: 4              # steps between prune sweeps
    prune_gain_min_cells: 15       # below this uncovered-cell count = redundant
    prune_keep_frontier: true      # never prune nodes bordering unknown

    # ── Phase 1: local commitment heuristic + stuck-node safety ──────────
    # commit_threshold: pick a direct lap neighbor unless a far candidate
    # has > 1/commit_threshold times more uncovered area. Stops the long
    # cross-map dashes (e.g. last sprint's 7m diagonals at steps 90→91 and
    # 93→94). 0.30 ≈ need >3.3× more gain to deviate from local sweep.
    # 1.0 = disable (pure utility argmax, Phase-0 behavior).
    commit_threshold: 0.30
    # Phase-6 path-cost penalty. When the straight line from current to a
    # candidate is collision-blocked, multiply Euclidean cost by this
    # factor — the real Nav2 path will route around walls, so a Euclidean-
    # near but path-far candidate should NOT win on cost. Kills the
    # "0.85 m goal that's actually 10 m around the central enclosure"
    # pattern (step 18 of the last two sprints, 168s and 179s respectively).
    # 1.0 = disabled (Euclidean only). 3.0 = blocked candidate needs 3× the
    # gain to beat an equivalent open-line one.
    path_blocked_penalty: 3.0
    # Phase-7 per-step Nav2 timeout (seconds). Each Nav2 goal in the cstar
    # path is capped at this duration; if Nav2 doesn't arrive in time the
    # navigator returns failure and the existing backup+retry path (capped
    # by MAX_NODE_FAILS=2) takes over. Stops the 206 s step-40 stall we
    # saw last sprint, where Nav2's controller saturated and burned the
    # default 120 s timeout twice (worst case ≈ 240 s). At 50 s the worst
    # case becomes ~100 s before the node is force-closed as unreachable.
    nav_step_timeout_s: 50.0
    # Stuck-node patience: force-close an OPEN node selected this many
    # times in a row when the rover can't actually reach within rc of it
    # (the "node 111 at (-3.64,-3.88) infinite-loop" bug at end of run).
    stuck_node_patience: 3
    # Total reselects (not just consecutive) before force-closing as
    # unreachable. Fixes the late-game pattern where the selector cycles
    # through a small ring of physically-unreachable frontier nodes,
    # preventing termination.
    stuck_node_total_patience: 3

    # ── Phase 2: en-route node closing ───────────────────────────────────
    # After each traverse, close OPEN nodes the rover physically drove over
    # (within enroute_close_radius of the straight path segment) and that are
    # now covered — so it never drives back to "visit" a node it already
    # covered in transit (the node-92-visited-twice pattern). Frontier nodes
    # (adjacent to unknown) are kept. radius ≈ coverage swath (rc=0.375) plus
    # a small margin for the curved actual path vs the straight segment.
    enroute_close_enable: true
    enroute_close_radius: 0.55     # ↑ from 0.40, proportional to rc bump

    # ── Phase 4: adaptive frontier density (surveillance framing) ────────
    # In open empty regions (>= density_open_distance from any obstacle),
    # keep only density_keep_floor fraction of lap samples. Cluttered /
    # feature-rich regions stay densely sampled — your "denser frontiers in
    # cluttered regions, sparser in open" framing. Surveillance doesn't
    # need exhaustive coverage of empty rooms; this removes scattered
    # open-area nodes that the selector wastes time targeting.
    density_keep_floor: 0.40       # 1.0 = uniform (legacy); 0.0 = strip all open
    density_open_distance: 1.5     # m from nearest obstacle to count as "open"

    # ── Unreachable-node pruning ─────────────────────────────────────────
    # Close OPEN nodes lodged inside the costmap inflation (closer than
    # unreachable_obstacle_margin to an obstacle). The rover can never reach
    # these, so they cause cross-map ping-pong as the selector re-targets
    # them — the main end-game overlap source (nodes 57/104/108 last sprint,
    # all ~0.1-0.3 m from a wall). margin ≈ inflation_radius (0.30).
    unreachable_prune_enable: true
    unreachable_obstacle_margin: 0.28

    # ── Coverage-efficiency early stop ───────────────────────────────────
    # Stop chasing scattered fragments once the rover is mostly just dashing
    # across covered map. Triggers when area-gained-per-metre over the last
    # eff_window_size steps drops below eff_stop_threshold AND coverage is
    # already past eff_stop_min_coverage. Robust to the stagnation detector
    # being fooled by the coverage a long transit paints en route.
    #   eff_stop_threshold units: m² covered per metre travelled. Full-swath
    #   productive driving ≈ 0.5-0.75; 0.12 means "<~20% of travel is useful."
    eff_stop_enable: true
    eff_window_size: 6
    eff_stop_threshold: 0.12
    eff_stop_min_coverage: 80.0

